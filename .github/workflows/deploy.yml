name: CI & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.solitude-store.ru' }}
          VITE_CDN_URL: ${{ secrets.VITE_CDN_URL || 'https://cdn.solitude-store.ru' }}
        run: yarn build

      - name: Upload dist
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: dist
          retention-days: 3

  deploy:
    name: Deploy to server
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist

      - name: Upload static via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: 'admin-dist/*'
          target: ${{ secrets.DEPLOY_ADMIN_PATH }}
          strip_components: 1
          overwrite: true
